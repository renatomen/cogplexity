name: publish

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - name: Verify the tag names the package version
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package.json version ${PKG_VERSION}" >&2
            exit 1
          fi
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run pack:check
      # The same exact-match calibration as ci.yml: a tag must not publish without it.
      # A missing fixture fails here: the job must never go green without comparing.
      - name: Read the fixture's commit and repository
        id: fixture
        run: |
          node -e '
            const fs = require("node:fs");
            const file = "calibration/fixtures/tasknotes-gantt.json";
            if (!fs.existsSync(file)) {
              console.error(`calibration fixture missing: ${file} — run node scripts/refresh-fixture.mjs tasknotes-gantt --project-key renatomen_obsidian-gantt --repository renatomen/tasknotes-gantt --sources src`);
              process.exit(1);
            }
            const { commitSha, repository } = JSON.parse(fs.readFileSync(file, "utf8"));
            if (!/^[0-9a-f]{40}$/.test(commitSha)) throw new Error(`unexpected commitSha: ${commitSha}`);
            if (repository !== "renatomen/tasknotes-gantt") throw new Error(`unexpected repository: ${repository} (the calibration corpus is renatomen/tasknotes-gantt)`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `commit=${commitSha}\nrepository=${repository}\n`);
            console.log(`fixture pins ${repository} at ${commitSha}`);
          '
      - name: Clone the corpus at the fixture commit
        env:
          COMMIT: ${{ steps.fixture.outputs.commit }}
          REPOSITORY: ${{ steps.fixture.outputs.repository }}
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/corpus"
          cd "$RUNNER_TEMP/corpus"
          git init -q
          git remote add origin "https://github.com/$REPOSITORY.git"
          git fetch --depth 1 origin "$COMMIT" || git fetch origin
          git cat-file -e "$COMMIT^{commit}"
      - name: Calibrate
        env:
          COGPLEXITY_CORPUS: ${{ runner.temp }}/corpus
        run: npm run calibrate
      - name: Upgrade npm for trusted publishing
        run: npm install -g --ignore-scripts npm@^11.5.1
      - run: npm publish --provenance --access public
